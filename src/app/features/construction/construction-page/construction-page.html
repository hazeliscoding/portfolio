<div class="construction-page gn-shell">
  <section class="gn-panel gn-panel--pop fade">
    <div class="gn-panel__head">
      <span class="gn-panel__glyph">✷</span>under construction
    </div>

    <div class="gn-panel__body construction">
      <h1 class="construction__title">brb — rebuilding</h1>

      <p class="construction__body">
        this site is being redesigned from scratch. nothing here is final and
        most of it is offline for now.
      </p>

      <p class="construction__output">
        check back soon ✧<span class="construction__cursor" aria-hidden="true"
          >_</span
        >
      </p>

      <div class="construction__links">
        <a class="gn-btn" [href]="'mailto:' + email">» email me</a>
        <a
          class="gn-btn gn-btn--secondary"
          [href]="github"
          target="_blank"
          rel="noopener"
          >» github</a
        >
      </div>
    </div>
  </section>
</div>
