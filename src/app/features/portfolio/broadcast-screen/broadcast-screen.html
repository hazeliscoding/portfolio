<div class="device">
  <div class="device__screen">
    @if (host()) {
      <div class="device__url" aria-hidden="true"><span class="device__dots"></span>{{ host() }}</div>
    }
    <img class="device__shot" [src]="shot()" [alt]="alt()" loading="lazy" />
  </div>
</div>
@if (phone()) {
  <div class="phone">
    <img [src]="phone()" [alt]="phoneAlt()" loading="lazy" />
  </div>
}
