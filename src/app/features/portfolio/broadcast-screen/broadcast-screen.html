<div class="device">
  <div class="device__screen">
    @if (host()) {
      <div class="device__url" aria-hidden="true"><span class="device__dots"></span>{{ host() }}</div>
    }
    @if (console().length) {
      <div class="device__console" role="img" [attr.aria-label]="alt()">
        @for (line of console(); track line.command) {
          <div>
            <span class="device__prompt">$</span> {{ line.command }}
            <span class="device__note"># {{ line.note }}</span>
          </div>
        }
      </div>
    } @else {
      <img class="device__shot" [src]="shot()" [alt]="alt()" loading="lazy" />
    }
  </div>
</div>
@if (phone()) {
  <div class="phone">
    <img [src]="phone()" [alt]="phoneAlt()" loading="lazy" />
  </div>
}
