<app-chapter-header code="ARCHIVE" index="03" [meta]="records()" />

<div
  class="archive__filters"
  role="group"
  aria-labelledby="archive-filter-label"
  [attr.data-sfx]="motion.sfx()"
>
  <span class="archive__filters-label" id="archive-filter-label">FILTER</span>

  @for (f of filters; track f) {
    <button
      type="button"
      class="archive__filter"
      [class.archive__filter--on]="filter() === f"
      [attr.aria-pressed]="filter() === f"
      (click)="pick(f)"
    >[{{ f }}]</button>
  }

  <!-- Live because the filter bar is the only place the result of pressing a
       pill is stated; the chapter header repeats it silently. -->
  <span class="archive__count" aria-live="polite">{{ records() }}</span>
</div>

<div class="archive__grid">
  @for (c of cards(); track c.id) {
    <a
      class="archive__card"
      [routerLink]="['/portfolio', c.id]"
      (mouseenter)="hover(c.id)"
      (mouseleave)="hover(null)"
      (focus)="hover(c.id)"
      (blur)="hover(null)"
    >
      <app-window
        class="archive__window"
        variant="media"
        [index]="c.index"
        [title]="c.title"
        [context]="c.year"
        [active]="activeFor(c.id)"
        [padded]="false"
        [footer]="c.footer"
        [delay]="c.delay"
      >
        <app-viewport-window
          class="archive__shot"
          frame="sides"
          ratio="16 / 9"
          [src]="c.image"
          [alt]="c.alt"
          [label]="c.cam"
        />

        <div class="archive__body">
          <p class="archive__desc">{{ c.description }}</p>

          <div class="archive__tags">
            @for (t of c.tags; track t) {
              <app-badge>{{ t }}</app-badge>
            }
          </div>
        </div>
      </app-window>
    </a>
  }
</div>
