<div class="app" [attr.data-sfx]="motion.sfx()">
  <app-system-bar position="top">
    <a barLeft class="app__wordmark" routerLink="/" aria-label="hazel.exe — home"
      >hazel<span class="app__ext">.exe</span></a
    >
    <app-readout barCenter label="NET" value="ONLINE" state="ok" />
    <!--
      Hand-rolled rather than an <app-readout>, because only the value
      flickers. Flickering the whole readout pulses the word SYNC too, which
      reads as the label being unstable rather than as a fresh reading
      arriving.
    -->
    <span barCenter class="app__sync">
      <span class="app__sync-label">SYNC</span>
      <span class="app__sync-value">{{ sync() }}</span>
    </span>
    <!--
      The gap after `//` is a CSS margin, not a space in the markup: Angular
      drops whitespace-only text nodes between elements, which printed
      `HAZEL.EXE //OPERATOR PROFILE`. The space before `//` survives because
      it belongs to a text node that is not whitespace-only.
    -->
    <span barCenter class="app__path"
      >HAZEL.EXE <span class="app__path-sep">//</span
      ><span class="app__path-label">{{ pathLabel() }}</span></span
    >
    <app-readout
      barRight
      class="app__status"
      label="STATUS"
      [value]="operatorStatus"
      state="ok"
    />
    <button barRight type="button" class="app__palette-key" (click)="paletteOpen.set(true)">
      [<span aria-hidden="true">&#8984;</span>K]<span class="app__sr-only"
        >Open the command palette</span
      >
    </button>
    <span barRight class="app__clock">{{ clock() }}</span>
  </app-system-bar>

  <div class="app__body">
    <app-mode-nav
      class="app__rail"
      [modes]="modes"
      [activeId]="activeMode()"
      (select)="onModeSelect($event)"
    />

    <span class="app__env" aria-hidden="true">{{ envWord() }}</span>

    <span class="app__wipe" aria-hidden="true"><span class="app__wipe-bar"></span></span>

    <main class="main" #mainRegion>
      <router-outlet />
    </main>
  </div>

  <app-system-bar position="bottom">
    <app-status-light barLeft [state]="lightState()" [label]="lightLabel()" />
    <span barLeft class="app__log" [attr.data-sfx]="motion.sfx()">{{ lastLog() }}</span>
    <span barRight class="app__hints">1–4 MODE · &#8984;K COMMAND · ESC BACK</span>
    <button barRight type="button" class="app__command" (click)="paletteOpen.set(true)">
      <span class="app__command-caret" aria-hidden="true">&gt;</span>COMMAND
    </button>
  </app-system-bar>

  <app-command-palette
    [open]="paletteOpen()"
    [commands]="commands"
    placeholder="go to / open / theme_"
    (run)="onCommandRun($event)"
    (close)="paletteOpen.set(false)"
  />

  @if (booting()) {
    <app-boot [clock]="clock()" (dismissed)="booting.set(false)" />
  }
</div>
