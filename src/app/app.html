<div class="app">
  <app-system-bar position="top">
    <span barLeft class="app__wordmark">hazel<span class="app__ext">.exe</span></span>
    <app-readout barCenter label="NET" value="ONLINE" state="ok" />
    <app-readout barCenter label="LOC" value="TEXAS // USA" />
    <app-readout barRight label="STATUS" value="OPEN TO WORK" state="ok" />
    <span barRight class="app__clock">{{ clock() }}</span>
  </app-system-bar>

  <div class="app__body">
    <app-mode-nav
      class="app__rail"
      [modes]="modes"
      [activeId]="activeMode()"
      (select)="onModeSelect($event)"
    />

    <main class="main">
      <router-outlet />
    </main>
  </div>

  <app-system-bar position="bottom">
    <span barLeft class="app__hints">
      <button type="button" class="app__command" (click)="paletteOpen.set(true)">
        <span aria-hidden="true">&#8984;K</span> COMMAND
      </button>
      <span class="app__hint">/ SEARCH</span>
      <span class="app__hint">ESC BACK</span>
    </span>
  </app-system-bar>

  <app-command-palette
    [open]="paletteOpen()"
    [commands]="commands"
    (run)="onCommandRun($event)"
    (close)="paletteOpen.set(false)"
  />
</div>
