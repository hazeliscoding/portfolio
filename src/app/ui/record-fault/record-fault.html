<div class="fault shell-width">
  <section class="fault__panel" aria-labelledby="fault-title">
    <a class="fault__back" [routerLink]="backRoute()"><span aria-hidden="true">←</span> {{ backLabel() }}</a>

    <div class="fault__body">
      <span class="fault__code" aria-hidden="true">404</span>
      <h1 class="fault__title" id="fault-title">This page wandered off.</h1>
      <p class="fault__report">There's nothing at this address. The link may be old, or the address has a typo.</p>

      <app-key-value [items]="report()" />

      <!--
        Real links, not scripted buttons. Both are navigation, and on the one
        page a visitor reaches by following something broken, the way out
        should be the thing a browser already knows how to open.
      -->
      <div class="fault__controls">
        <app-button variant="primary" size="md" [routerLink]="backRoute()">{{ backAction() }}</app-button>
        <app-button variant="secondary" size="md" [routerLink]="other().route">{{ other().label }}</app-button>
      </div>
    </div>
  </section>
</div>
