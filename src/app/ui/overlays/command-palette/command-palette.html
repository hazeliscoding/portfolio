@if (open()) {
  <div class="palette-scrim" (click)="close.emit()">
    <div
      class="palette"
      role="dialog"
      aria-modal="true"
      aria-label="Search"
      (click)="$event.stopPropagation()"
      (keydown)="onKeydown($event)"
    >
      <div class="palette__prompt">
        <span class="palette__caret" aria-hidden="true"
          ><svg viewBox="0 0 24 24" focusable="false">
            <path
              d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
            /></svg
        ></span>
        <input
          #paletteInput
          id="palette-input"
          class="palette__input"
          type="text"
          role="combobox"
          autocomplete="off"
          aria-label="Search"
          aria-controls="palette-list"
          aria-expanded="true"
          [attr.aria-activedescendant]="
            selectedIndex() >= 0 ? optionId(selectedIndex()) : null
          "
          [attr.placeholder]="placeholder()"
          [value]="query()"
          (input)="onInput($event)"
        />
        <span class="palette__esc" aria-hidden="true">ESC</span>
      </div>

      <ul id="palette-list" class="palette__list" role="listbox" aria-label="Results">
        @for (cmd of filtered(); track cmd.id; let i = $index) {
          <li
            class="palette__item"
            role="option"
            [id]="optionId(i)"
            [attr.aria-selected]="i === selectedIndex()"
            [class.palette__item--selected]="i === selectedIndex()"
            (click)="run.emit(cmd.id)"
            (mouseenter)="activeIndex.set(i)"
          >
            <span class="palette__mode">{{ cmd.mode }}</span>
            <span class="palette__label">{{ cmd.label }}</span>
            @if (cmd.hint) {
              <span class="palette__hint">{{ cmd.hint }}</span>
            }
          </li>
        } @empty {
          <li class="palette__empty">Nothing matches that yet.</li>
        }
      </ul>
    </div>
  </div>
}
