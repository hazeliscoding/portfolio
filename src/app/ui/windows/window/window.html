<section
  class="window"
  [attr.data-variant]="variant()"
  [attr.data-active]="activeAttr()"
  [attr.aria-label]="title()"
  [attr.data-sfx]="motion.sfx()"
  [style.animation-delay]="delay() || null"
>
  @if (active() === true) {
    <span class="window__corner" aria-hidden="true"></span>
  }

  @if (title() || index() || context()) {
    <div class="window__head">
      @if (index()) {
        <span class="window__index">{{ index() }}</span>
      }
      <span class="window__title">{{ title() }}</span>
      @if (context()) {
        <span class="window__sep">//</span>
        <span class="window__context">{{ context() }}</span>
      }
      <span class="window__meta">
        @if (status()) {
          <span class="window__status">{{ status() }}</span>
        }
        <ng-content select="[windowControls]" />
      </span>
    </div>
  }

  <div class="window__body" [class.window__body--padded]="padded()">
    <ng-content />
  </div>

  @if (footer()) {
    <footer class="window__foot">{{ footer() }}</footer>
  }
</section>
