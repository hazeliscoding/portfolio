<figure class="viewport" [attr.data-frame]="frame()" [style.aspect-ratio]="ratio()">
  @if (src()) {
    <img
      class="viewport__img"
      [class.viewport__img--pixelated]="pixelated()"
      [src]="src()"
      [alt]="alt()"
    />
  } @else {
    <span class="viewport__nosignal" role="img" [attr.aria-label]="alt() || 'no signal'"
      >NO SIGNAL</span
    >
  }
  @if (scan()) {
    <span class="viewport__scan" aria-hidden="true"></span>
  }
  @if (label()) {
    <figcaption class="viewport__label">{{ label() }}</figcaption>
  }
</figure>
