<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>hazel.exe — blog entry card source</title>

    <!--
      THE PER-ENTRY SOCIAL CARD. scripts/generate-og-cards.mjs opens this in
      headless Chrome with ?title=&entry=&date=&tags= and screenshots it to
      public/images/og/blog/<slug>.png. Rendered by a browser, not sharp, for
      the reason in og-card.html: sharp cannot load the webfonts.

      Same KAIRO rules as the site card: dark surface, signal red, hairline
      frame, no shadows, no gradients, no emoji. Colours are the token values,
      inlined because this renders outside the app.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600&family=IBM+Plex+Mono:wght@400&display=block"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        background: #0b0e12;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0e12; /* --surface-canvas */
      }

      .frame {
        position: absolute;
        inset: 24px;
        border: 1px solid #28313b; /* --border-default */
      }

      .wordmark {
        position: absolute;
        left: 72px;
        top: 64px;
        font: 600 44px/1 "Saira Condensed", sans-serif;
        letter-spacing: 0.02em;
        color: #e9e7e1; /* --text-primary */
      }

      .wordmark i {
        font-style: normal;
        color: #e8382c; /* --signal-active */
      }

      .entry {
        position: absolute;
        right: 72px;
        top: 76px;
        font: 400 20px/1 "IBM Plex Mono", monospace;
        letter-spacing: 1.8px;
        color: #8b949d; /* --text-muted */
      }

      .entry b {
        font-weight: 400;
        color: #e8382c;
      }

      /* The title box is fixed; fit() shrinks the type until it fits in it. */
      .title {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 168px;
        height: 300px;
        display: flex;
        align-items: center;
        font: 600 88px/1.04 "Saira Condensed", sans-serif;
        letter-spacing: 0.01em;
        color: #e9e7e1;
      }

      .meta {
        position: absolute;
        left: 72px;
        right: 360px;
        bottom: 72px;
        font: 400 20px/1 "IBM Plex Mono", monospace;
        letter-spacing: 1.8px;
        /* --text-muted, not --text-faint: a card is read shrunk in a feed. */
        color: #8b949d;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .meta b {
        font-weight: 400;
        color: #aeb6bd; /* --text-secondary */
      }

      .site {
        position: absolute;
        right: 72px;
        bottom: 72px;
        font: 400 20px/1 "IBM Plex Mono", monospace;
        letter-spacing: 1.8px;
        color: #8b949d;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="frame"></div>
      <div class="wordmark">hazel<i>.exe</i></div>
      <div class="entry">LOG_04 // <b id="entry">0000</b></div>
      <div class="title"><span id="title">Entry title</span></div>
      <div class="meta"><b id="date">YYYY-MM-DD</b><span id="tags"></span></div>
      <div class="site">HAZELISCODING.DEV</div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const set = (id, text) => (document.getElementById(id).textContent = text);
      set('title', params.get('title') ?? 'Entry title');
      set('entry', params.get('entry') ?? '0000');
      set('date', params.get('date') ?? 'YYYY-MM-DD');
      set(
        'tags',
        (params.get('tags') ?? '')
          .split(',')
          .filter(Boolean)
          .map((tag) => ` · ${tag.toUpperCase()}`)
          .join(''),
      );

      // Shrink in 2px steps until the title fits its box. Runs after the
      // webfonts load: measured in the fallback face it would fit wrongly.
      document.fonts.ready.then(() => {
        const box = document.querySelector('.title');
        const text = document.getElementById('title');
        let size = 88;
        while (size > 40 && text.offsetHeight > box.clientHeight) {
          size -= 2;
          box.style.fontSize = `${size}px`;
        }
        document.body.dataset.ready = 'true';
      });
    </script>
  </body>
</html>
