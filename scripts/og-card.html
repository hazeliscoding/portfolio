<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>hazeliscoding — social card source</title>

    <!--
      THIS FILE IS THE SOCIAL CARD. Edit it, then run `npm run og:cards`, which
      renders it to public/og-image.png at 1200 x 630 in headless Chrome, along
      with every post's card. `npm run check:og` confirms the size.

      It is HTML in a real browser, not an SVG through sharp, because sharp's
      rasteriser can't load webfonts: an earlier SVG card silently fell back to
      a generic face for months (see scripts/check-og-image.mjs).

      The site's light shop: lavender-white paper, one ink, the purple accent,
      and a near-black band for the work, in Bricolage Grotesque and JetBrains
      Mono. Colours are the token values, inlined because this renders outside
      the app. The stickers are the shipped apps' own icons, as on the home
      page's hero.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500&display=block"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        background: #fbfbfd;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        /* --h-paper, with a lavender wash in the corner. */
        background:
          radial-gradient(60% 80% at 0% 0%, #f2f0f7 0%, transparent 70%),
          #fbfbfd;
        font-family: "Bricolage Grotesque", sans-serif;
        color: #262435; /* --h-ink */
      }

      .wordmark {
        position: absolute;
        left: 80px;
        top: 68px;
        font: 700 38px/1 "Bricolage Grotesque", sans-serif;
        letter-spacing: -0.03em;
      }

      .wordmark i {
        font-style: normal;
        color: #6651cf; /* --h-purple */
      }

      .eyebrow {
        position: absolute;
        left: 80px;
        top: 196px;
        font: 600 23px/1 "Bricolage Grotesque", sans-serif;
        color: #5736a1; /* --h-purple-ink: AA on paper at this size */
      }

      .title {
        position: absolute;
        left: 78px;
        top: 240px;
        width: 560px;
        font: 600 80px/1.02 "Bricolage Grotesque", sans-serif;
        letter-spacing: -0.045em;
      }

      .site {
        position: absolute;
        left: 80px;
        bottom: 68px;
        font: 500 21px/1 "JetBrains Mono", monospace;
        color: #696777; /* --h-ink-3 */
      }

      /* The work, on the shop's near-black band. */
      .band {
        position: absolute;
        top: 40px;
        right: 40px;
        bottom: 40px;
        width: 470px;
        border-radius: 28px;
        background:
          radial-gradient(80% 70% at 70% 30%, rgba(102, 81, 207, 0.35), transparent 70%),
          #1c1c1e; /* --h-night */
      }

      /* Die-cut stickers: a white border, a soft shadow and a slight turn each. */
      .sticker {
        position: absolute;
        width: 116px;
        height: 116px;
        padding: 8px;
        box-sizing: border-box;
        border-radius: 32px;
        background: #fff;
        box-shadow: 0 18px 36px -12px rgba(0, 0, 0, 0.55);
      }

      .sticker img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 24px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="wordmark">hazeliscoding<i>.</i></div>
      <div class="eyebrow">Hazel Granados · full-stack developer &amp; AI engineer</div>
      <div class="title">Small apps that each do one job.</div>
      <div class="site">hazeliscoding.dev</div>

      <!-- Two, three, two: the shipped apps, in the projects page's order. -->
      <div class="band">
        <div class="sticker" style="left: 92px; top: 52px; transform: rotate(-8deg)">
          <img src="../public/images/projects/xiv-vault/icon.svg" alt="" />
        </div>
        <div class="sticker" style="left: 254px; top: 40px; transform: rotate(6deg)">
          <img src="../public/images/projects/gil-sweep/icon.svg" alt="" />
        </div>
        <div class="sticker" style="left: 22px; top: 210px; transform: rotate(5deg)">
          <img src="../public/images/projects/prompuff/icon.svg" alt="" />
        </div>
        <div class="sticker" style="left: 177px; top: 200px; transform: rotate(-5deg)">
          <img src="../public/images/projects/sweepling/icon.svg" alt="" />
        </div>
        <div class="sticker" style="left: 332px; top: 214px; transform: rotate(8deg)">
          <img src="../public/images/projects/conatlas-tx/icon.svg" alt="" />
        </div>
        <div class="sticker" style="left: 96px; top: 372px; transform: rotate(7deg)">
          <img src="../public/images/projects/staypaw/icon.svg" alt="" />
        </div>
        <div class="sticker" style="left: 258px; top: 380px; transform: rotate(-7deg)">
          <img src="../public/images/projects/sdl3-porter/icon.svg" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
