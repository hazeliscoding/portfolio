<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .display { font-family: "Saira Condensed", sans-serif; }
      .mono { font-family: "IBM Plex Mono", monospace; }
    </style>
  </defs>

  <!-- KAIRO surface-canvas -->
  <rect width="1200" height="630" fill="#0b0e12" />

  <!-- Hairline inset frame, no rounding -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#28313b" stroke-width="1" />

  <!-- Wordmark -->
  <text x="96" y="320" class="display" font-weight="600" font-size="132" fill="#e9e7e1">hazel<tspan fill="#e8382c">.exe</tspan></text>

  <!-- Identifier line -->
  <text x="98" y="374" class="mono" font-size="22" letter-spacing="3.5" fill="#8b949d">HAZEL.EXE // OPERATOR PROFILE</text>

  <!-- Status readout, lower-left -->
  <circle cx="98" cy="558" r="6" fill="#55d88a" />
  <text x="118" y="564" class="mono" font-size="20" letter-spacing="1.8" fill="#5c6670">NET <tspan fill="#55d88a">ONLINE</tspan></text>
</svg>
